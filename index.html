<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Star Voyager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<section id="menu">
  <form id="form" class="card" autocomplete="off">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2l2.2 6.5L21 15l-6.4-1.2L12 22l-2.6-8.2L3 15l6.8-6.5z"/></svg>
      <h1>Star Voyager</h1>
    </div>
    <p class="sub">Jelajahi tata surya dengan pesawatmu sendiri.</p>
    <label class="field">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <input id="name" maxlength="16" placeholder="Nama pilot" required>
    </label>
    <button class="go" type="submit">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>
      Mulai terbang
    </button>
    <p class="hint">Kiri: gerakkan pesawat. Kanan: putar kamera.</p>
  </form>
</section>

<section id="hud" class="hidden">
  <div class="panel tl"><span id="pilot">Pilot</span><b id="spd">0</b><small>km/s</small></div>
  <div class="panel tr"><span id="near">-</span><b id="dist">0</b><small>km ke permukaan</small></div>
  <div class="bar"><i id="energy"></i></div>
  <div id="warn">Hampir menabrak</div>
  <div class="btns">
    <button class="btn" id="btnBrake" aria-label="Rem">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <button class="btn nitro" id="btnNitro" aria-label="Nitro">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>
    </button>
  </div>
  <div class="stick" id="stickL"><i></i></div>
  <div class="stick" id="stickR"><i></i></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
